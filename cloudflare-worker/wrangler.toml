name = "janells-run-feedback"
main = "src/index.js"
compatibility_date = "2024-01-01"

# After deploying, set the GitHub PAT as a secret:
# wrangler secret put GITHUB_TOKEN

# 5 submissions a minute per IP (Workers rate limiting binding; period is 10 or 60 seconds).
# The worker skips the check if the binding is missing, so an old deploy keeps working.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
