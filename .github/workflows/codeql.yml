name: CodeQL

# Replaces GitHub's default code scanning setup, which can't build the Xcode
# project on its own (it finds no Swift targets), so the app code went unscanned.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL watches this build to see the Swift code. No signing is needed
      # for a simulator build.
      - name: Build app
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          xcodebuild build \
            -project JanellsRunApp.xcodeproj \
            -scheme JanellsRunApp \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
